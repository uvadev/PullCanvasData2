name: .NET

on:
  push:
    branches: [ master ]

jobs:
  build-package:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Compile Package
      working-directory: PullCanvasData2
      run: dotnet pack PullCanvasData2.csproj -c Release
    - name: Check Package On .NET Framework
      shell: bash
      run: |
        dotnet build PackageCheck/PackageCheck.csproj -c Release -p:PullCanvasData2Version=$(dotnet msbuild PullCanvasData2/PullCanvasData2.csproj -getProperty:Version)
        PackageCheck/bin/Release/net48/PackageCheck.exe
    - uses: actions/upload-artifact@v4
      with:
        name: pca
        path: PullCanvasData2/bin/Release/PullCanvasData2*.nupkg

  deploy-package:
  
    runs-on: ubuntu-latest
    needs: build-package
    
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: pca
    - name: Run deploy script
      run: curl -vX PUT -u "uvadev:${{secrets.GITHUB_TOKEN}}" -F package="@$(echo PullCanvasData2.*.nupkg)" https://nuget.pkg.github.com/uvadev/
      shell: bash
